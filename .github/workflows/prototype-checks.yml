name: Prototype UI checks

on:
  push:
    branches:
      - 'experiment/**'
  pull_request:
    paths:
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/prototype-checks.yml'

permissions:
  contents: read

jobs:
  prototype-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run dependency-free source checks
        run: node --test tests/prototype.test.mjs
      - name: Install isolated browser test tools
        run: npm install --no-save --no-package-lock playwright@1.56.1 @axe-core/playwright@4.10.2
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Run browser and accessibility checks
        run: node --test tests/browser.test.mjs
